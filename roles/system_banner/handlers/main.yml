---
- name: Restart SystemBanner
  ansible.windows.win_shell: |
    $procs = Get-Process -Name SystemBanner -ErrorAction SilentlyContinue
    if ($procs) { $procs | Stop-Process -Force }
    Start-Sleep -Seconds 1

    $explorer = Get-WmiObject -Class Win32_Process -Filter "Name='explorer.exe'" |
      Select-Object -First 1
    if ($explorer) {
      $owner = $explorer.GetOwner()
      $user = "$($owner.Domain)\$($owner.User)"

      $action = New-ScheduledTaskAction -Execute "C:\Program Files\SystemBanner\SystemBanner.exe"
      $principal = New-ScheduledTaskPrincipal -UserId $user -LogonType Interactive -RunLevel Limited
      $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
      Register-ScheduledTask -TaskName "SystemBannerRestart" -Action $action -Principal $principal -Settings $settings -Force | Out-Null
      Start-ScheduledTask -TaskName "SystemBannerRestart"
      Start-Sleep -Seconds 2
      Unregister-ScheduledTask -TaskName "SystemBannerRestart" -Confirm:$false
    }
  listen: Restart SystemBanner
